<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry | BlueCatch</title><meta name="description" content="BlueCatch fresh seafood and fish market."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="booking.css"></head><body><main class="booking-shell"><div class="booking-card"><div class="booking-top"><button class="icon-btn theme-only" data-theme aria-label="Switch to dark mode"><i data-lucide="moon"></i></button><button class="icon-btn rtl-only" data-rtl aria-label="Switch to RTL"><span class="rtl-text">RTL</span></button></div><div class="booking-logo"><a class="brand" href="index.html"><span class="logo-mark" aria-hidden="true"><svg class="brand-fish" viewBox="0 0 72 52" role="img" aria-label="BlueCatch fish and wave"><path d="M7 25.8C15.4 14.2 27.8 9.5 42 14.1C48.1 16 52.6 20 56 25.8C49.5 34.8 39.1 39.1 27.2 37.2C18.8 35.9 11.9 31.9 7 25.8Z" fill="var(--primary)"/><path d="M49.3 25.8L66 13.5L62.2 25.8L66 38.1Z" fill="var(--secondary)"/><circle cx="21.5" cy="22" r="2.6" fill="#fff"/><path d="M15 44.5C23 39.5 31.4 39.2 39 42.2C46.1 45 52.1 44.4 58.5 40.7" fill="none" stroke="var(--secondary)" stroke-width="4" stroke-linecap="round"/><path d="M28.5 15.5C31.5 20.4 31.5 29.5 28.4 36.4" fill="none" stroke="var(--secondary)" stroke-width="2.6" stroke-linecap="round"/></svg></span><span class="brand-copy"><span class="brand-name"><span class="brand-blue">Blue</span><span class="brand-catch">Catch</span></span><span class="brand-subtitle">Fresh catch. Thoughtful sourcing.</span></span></a></div><div class="section-head center"><div class="eyebrow">Market order desk</div><h1>Order enquiry</h1><p>Share what you are planning and we will help you shape a clear seafood request.</p></div><form class="form-grid" action="#" method="post">
<div class="form-group"><label for="full-name">Full name</label><input id="full-name" name="full_name" type="text" placeholder="Your full name" required></div>
<div class="form-group"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" placeholder="+91 98765 43210" required></div>
<div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div>
<div class="form-group"><label for="order-date">Preferred date</label><input id="order-date" name="order_date" type="date" required></div>
<div class="form-group"><label for="seafood">Seafood choice</label><select id="seafood" name="seafood" required><option value="">Choose a fish or shellfish</option><option>Indian Mackerel</option><option>Pomfret</option><option>Seabass</option><option>Fresh Prawns</option><option>Sardines</option><option>Crab</option><option>Not sure — recommend one</option></select></div>
<div class="form-group"><label for="quantity">Quantity / guests</label><input id="quantity" name="quantity" type="text" placeholder="e.g. 2 kg or 6 guests" required></div>
<div class="form-group"><label for="cut">Preferred cut</label><select id="cut" name="cut"><option>Whole</option><option>Cleaned</option><option>Portioned</option><option>Filleted</option><option>No preference</option></select></div>
<div class="form-group"><label for="order-type">Order type</label><select id="order-type" name="order_type"><option>Delivery</option><option>Market collection</option><option>Not sure</option></select></div>
<div class="form-group full"><label for="address">Delivery / collection details</label><input id="address" name="address" type="text" placeholder="Area, landmark or collection preference"></div>
<div class="form-group full"><label for="notes">Preparation &amp; order notes</label><textarea id="notes" name="notes" placeholder="Tell us the cooking method, timing, recipe idea or anything else we should know..."></textarea></div>
<div class="form-group full"><button class="btn btn-secondary" type="submit">Submit order enquiry <i data-lucide="arrow-right"></i></button></div>
</form></div></main><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><script src="script.js"></script></body></html>
